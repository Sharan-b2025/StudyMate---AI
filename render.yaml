databases:
  - name: studymate-db
    plan: free
    databaseName: studymate
    user: studymate

services:
  - type: web
    name: studymate-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && apt-get update && apt-get install -y tesseract-ocr || true"
    startCommand: "flask db upgrade && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    envVars:
      - key: FLASK_APP
        value: manage.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PYTHON_VERSION
        value: 3.12.4
