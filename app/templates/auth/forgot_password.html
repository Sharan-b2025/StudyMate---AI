{% extends "auth_base.html" %}
{% block title %}Reset password — StudyMate AI{% endblock %}
{% block auth_content %}
<div class="auth-title">Forgot your password?</div>
<div class="auth-sub">Enter your email and we'll send you a reset link</div>
<form method="POST">
  <div class="field">
    <label>Email</label>
    <input type="email" name="email" required autofocus placeholder="you@example.com">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
</form>
<div class="auth-switch"><a href="{{ url_for('auth.login') }}">← Back to sign in</a></div>
{% endblock %}
