{% extends "auth_base.html" %}
{% block title %}Set new password — StudyMate AI{% endblock %}
{% block auth_content %}
<div class="auth-title">Set a new password</div>
<div class="auth-sub">Choose a new password for your account</div>
<form method="POST">
  <div class="field">
    <label>New password</label>
    <input type="password" name="password" required autofocus placeholder="At least 6 characters">
  </div>
  <div class="field">
    <label>Confirm new password</label>
    <input type="password" name="confirm_password" required placeholder="Repeat password">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Update password</button>
</form>
{% endblock %}
