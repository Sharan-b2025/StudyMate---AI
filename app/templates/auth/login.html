{% extends "auth_base.html" %}
{% block title %}Sign in — StudyMate AI{% endblock %}
{% block auth_content %}
<div class="auth-title">Welcome back</div>
<div class="auth-sub">Sign in to continue your study streak</div>
<form method="POST">
  <div class="field">
    <label>Email</label>
    <input type="email" name="email" required autofocus placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" name="password" required placeholder="••••••••">
  </div>
  <div class="flex items-center justify-between mb-3" style="font-size:13px;">
    <label style="display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text-secondary);margin:0;">
      <input type="checkbox" name="remember" style="width:auto;">
      Remember me
    </label>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Sign in</button>
</form>
<div class="auth-switch">New to StudyMate AI? <a href="{{ url_for('auth.register') }}">Create an account</a></div>
{% endblock %}
