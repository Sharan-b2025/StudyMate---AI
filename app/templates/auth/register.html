{% extends "auth_base.html" %}
{% block title %}Create account — StudyMate AI{% endblock %}
{% block auth_content %}
<div class="auth-title">Create your account</div>
<div class="auth-sub">Start planning smarter, not harder</div>
<form method="POST">
  <div class="field">
    <label>Full name</label>
    <input type="text" name="name" required autofocus placeholder="Ada Lovelace">
  </div>
  <div class="field">
    <label>Email</label>
    <input type="email" name="email" required placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" name="password" required placeholder="At least 6 characters">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
<div class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></div>
{% endblock %}
