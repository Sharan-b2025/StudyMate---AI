<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyMate AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 420px; padding: 40px; }
    .auth-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
    .auth-brand .logo-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--grad-primary); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: var(--shadow-glow); }
    .auth-title { text-align: center; font-size: 24px; margin-bottom: 6px; }
    .auth-sub { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
    .auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary); }
    .auth-switch a { color: var(--violet-light); font-weight: 600; }
  </style>
</head>
<body>
  <div class="flash-stack">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>
  <div class="auth-wrap">
    <div class="auth-card card glass fade-up">
      <div class="auth-brand"><div class="logo-mark">🎓</div> StudyMate<span class="gradient-text">AI</span></div>
      {% block auth_content %}{% endblock %}
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
